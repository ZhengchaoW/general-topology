<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preload" as="fetch" href="data/atlas.json" crossorigin><link rel="preload" as="fetch" href="data/source-text.json" crossorigin><link rel="preload" as="fetch" href="data/review-notes.json" crossorigin><meta name="color-scheme" content="light dark"><title>General Topology Atlas v5</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><link rel="stylesheet" href="blocks.css"><link rel="stylesheet" href="desk.css"><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section class="ring-side">
    <header class="ring-head"><div class="brand"><b>General Topology</b><small>Hyperbolic Geodesics · pending teacher review</small></div>
      <div class="search"><input id="search" type="search" placeholder="Search…  /" autocomplete="off" spellcheck="false"><div id="results" class="results" role="listbox" hidden></div></div></header>
    <div class="graph-wrap"><canvas id="graph" role="img" aria-label="Hyperbolic course network. Use the accessible Index for every entity and relation."></canvas><div id="tip" class="tip" hidden></div>
      <div class="ring-foot"><div class="key" id="key"></div><div class="zoom"><button data-z="out" aria-label="Zoom out">−</button><output id="zoomv">100%</output><button data-z="in" aria-label="Zoom in">+</button><button data-z="fit">Reset</button></div></div>
    </div>
  </section>
  <section class="desk" id="desk"><button class="sheet-handle" aria-label="Change reading sheet height"></button><nav class="trail" id="trail"></nav><div class="scroll" id="desk-scroll"></div></section>
  <div id="why" class="modal" hidden><div class="why-box"><button class="close" data-action="close-why" aria-label="Close">×</button><div id="why-body"></div></div></div>
</div>
<script type="module" src="bundle.mjs"></script>
</body>
</html>
